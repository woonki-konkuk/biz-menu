<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경영학과 메뉴 구성 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
@font-face{font-family:'S-Core Dream';font-weight:500;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-5Medium.woff') format('woff')}
@font-face{font-family:'S-Core Dream';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-6Bold.woff') format('woff')}

:root{
  color-scheme:light;
  --ku-green:#005128; --green-bright:#18944A;
  --ink:#1A211D; --ink-2:#4F5B55; --ink-3:#7B8680;
  --line:#D8E0DA; --line-strong:#B9C6BE; --bar:#E3E9E5;
  --ground:#F4F7F5; --surface:#FFFFFF;
  --display:'S-Core Dream','Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --wrap:1140px; --gutter:24px;
}
*,*::before,*::after{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{appearance:none;background:none;border:0;font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--green-bright);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.25;font-weight:700}
p,dl,dt,dd{margin:0}
ul{margin:0;padding:0;list-style:none}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gutter)}

/* ── 헤더: 로고 + 상단 메뉴 (드롭다운 없음) ── */
.hdr{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:stretch;justify-content:space-between;gap:32px}
.logo{display:flex;align-items:center;gap:12px;padding:16px 0}
.logo .ku{display:inline-grid;place-items:center;width:44px;height:44px;border:2px solid var(--ku-green);color:var(--ku-green);font-family:var(--display);font-weight:700;font-size:15px;border-radius:3px}
.logo .name{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.logo .name small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:2px}
.gnb{display:flex;align-items:stretch;gap:2px}
.gnb button{position:relative;font-family:var(--display);font-weight:500;font-size:17px;padding:0 14px;color:var(--ink)}
.gnb button::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;background:var(--ku-green);opacity:0;transition:opacity .15s}
.gnb button:hover{color:var(--ku-green)}
.gnb button[aria-current="true"]{color:var(--ku-green);font-weight:700}
.gnb button[aria-current="true"]::after{opacity:1}

/* ── 하위 메뉴 = 페이지 안의 탭 (제목 아래) ── */
.tabs{display:flex;gap:2px;margin-top:22px;border-bottom:1px solid var(--line-strong);overflow-x:auto;scrollbar-width:none}
.tabs[hidden]{display:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:12px 18px 10px;font-family:var(--display);font-weight:500;font-size:15px;color:var(--ink-2);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ku-green)}
.tabs button[aria-current="true"]{color:var(--ku-green);font-weight:700;border-bottom-color:var(--ku-green)}
.tabs .ext::after{content:" ↗";font-size:12px;color:var(--ink-3)}

/* ── 본문 (히어로 없음, 제목 한 줄로 시작) ── */
.page{position:relative;overflow:hidden;padding:36px 0 80px}
.page > .wrap{position:relative;z-index:1}

/* ── 건국대 엠블럼 워터마크 (오른쪽 상단) — 링은 고정, 안쪽 황소만 걷는 박자로 움직임 ── */
.emblem-wm{position:absolute;top:-24px;right:-64px;z-index:0;width:min(380px,38vw);opacity:.09;pointer-events:none;user-select:none;-webkit-user-select:none;will-change:transform;transform-origin:50% 45%}
.emblem-wm img{width:100%;display:block}
.emblem-ring{
  -webkit-mask-image:radial-gradient(circle closest-side at 50% 50%,transparent 69%,#000 70%),radial-gradient(ellipse 9.5% 5.5% at 53% 87.7%,transparent 96%,#000 100%);
  -webkit-mask-composite:source-in;
  mask-image:radial-gradient(circle closest-side at 50% 50%,transparent 69%,#000 70%),radial-gradient(ellipse 9.5% 5.5% at 53% 87.7%,transparent 96%,#000 100%);
  mask-composite:intersect}
.emblem-bull{position:absolute;inset:0;
  -webkit-mask-image:radial-gradient(circle closest-side at 50% 50%,#000 69%,transparent 70%),radial-gradient(ellipse 9.5% 5.5% at 53% 87.7%,#000 96%,transparent 100%);
  mask-image:radial-gradient(circle closest-side at 50% 50%,#000 69%,transparent 70%),radial-gradient(ellipse 9.5% 5.5% at 53% 87.7%,#000 96%,transparent 100%);
  transform-origin:50% 80%;animation:bullWalk 2.6s ease-in-out infinite}
@keyframes bullWalk{
  0%{transform:translateY(0) rotate(0deg)}
  25%{transform:translateY(-3px) rotate(.8deg)}
  50%{transform:translateY(.6px) rotate(0deg)}
  75%{transform:translateY(-3px) rotate(-.8deg)}
  100%{transform:translateY(0) rotate(0deg)}}
@media (prefers-reduced-motion:reduce){.emblem-bull{animation:none}}
.page h1{font-size:28px;letter-spacing:-.01em}
.lead{margin-top:22px;font-size:15px;color:var(--ink-2)}
.lead[hidden]{display:none}
.content{margin-top:22px}
.note{margin-top:14px;font-size:13px;color:var(--ink-3)}
.note a{color:var(--green-bright);text-decoration:underline;text-underline-offset:3px}

/* ── 하위 내용 스케치 (구조만, 값은 회색 바) ── */
.sk{display:inline-block;height:10px;border-radius:5px;background:var(--bar);vertical-align:middle}
.sk.w1{width:18%}.sk.w2{width:32%}.sk.w3{width:48%}.sk.w4{width:64%}.sk.w5{width:82%}.sk.w6{width:100%}
.img{background:repeating-linear-gradient(135deg,transparent 0 12px,rgba(0,81,40,.045) 12px 24px),var(--ground);border:1px dashed var(--line-strong);border-radius:4px;display:grid;place-items:center;color:var(--ink-3);font-size:12px}

.ph{min-height:240px;display:grid;place-items:center;text-align:center;border:1px dashed var(--line-strong);border-radius:6px;color:var(--ink-3);font-size:14px;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(0,81,40,.045) 14px 28px)}

.tbl{width:100%;border-collapse:collapse;font-size:14px;border-top:2px solid var(--ku-green)}
.tbl th{font-weight:600;background:var(--ground);padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line)}
.tbl .c{text-align:center}
.tbl .num{color:var(--ink-3);font-variant-numeric:tabular-nums}

.dl{border-top:2px solid var(--ku-green)}
.dl > div{display:grid;grid-template-columns:220px 1fr;border-bottom:1px solid var(--line)}
.dl dt{padding:13px 16px;background:var(--ground);font-weight:600;font-size:14px}
.dl dd{padding:13px 16px;display:flex;align-items:center}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 20px}
.card .img{aspect-ratio:3/4}
.card .nm{margin-top:12px;display:block;height:14px;width:46%;border-radius:7px;background:var(--bar)}
.card .fd{font-size:13px;color:var(--green-bright);margin-top:8px;font-weight:500}
.card .ct{margin-top:8px;display:grid;gap:7px}

.faq > div{display:flex;align-items:center;gap:14px;padding:15px 6px;border-bottom:1px solid var(--line)}
.faq > div:first-child{border-top:2px solid var(--ku-green)}
.faq .q{font-family:var(--display);font-weight:700;color:var(--ku-green);font-size:15px}
.faq .pl{margin-left:auto;color:var(--ink-3);font-size:18px;line-height:1}

.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.gallery .img{aspect-ratio:4/3}
.gallery .cap{margin-top:10px;display:grid;gap:7px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start}
.split .img{aspect-ratio:4/3}
.para{display:grid;gap:11px;padding-top:4px}

.extcard{border:1px solid var(--line);padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.extcard b{font-family:var(--display);font-size:16px}
.extcard span{display:block;font-size:14px;color:var(--ink-2);margin-top:4px}
.btn{display:inline-block;background:var(--ku-green);color:#fff;padding:10px 18px;border-radius:3px;font-size:14px;font-weight:600;white-space:nowrap}

.sitemap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 20px}
.sitemap h3{font-size:15px;color:var(--ku-green);padding-bottom:8px;border-bottom:2px solid var(--ku-green);margin-bottom:8px}
.sitemap li{font-size:14px;padding:3px 0;color:var(--ink-2)}
.sitemap li.muted{color:var(--ink-3);font-size:13px}

.login{max-width:360px;display:grid;gap:10px}
.login input{font:inherit;font-size:14px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface)}
.login .btn{text-align:center;margin-top:4px}

@media (max-width:900px){
  .bar{flex-wrap:wrap}
  .gnb{flex-wrap:wrap;padding-bottom:8px}
  .gnb button{padding:10px 12px}
  .cards,.sitemap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:1fr}
  .dl > div{grid-template-columns:140px 1fr}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="#"><span class="ku">KU</span><span class="name"><small>KONKUK UNIVERSITY</small>경영학과</span></a>
      <nav class="gnb" id="gnb" aria-label="주 메뉴"></nav>
    </div>
  </div>
</header>

<main class="page">
  <div class="emblem-wm" id="emblem" aria-hidden="true">
    <img class="emblem-ring" src="konkuk-emblem.png" alt="">
    <img class="emblem-bull" src="konkuk-emblem.png" alt="">
  </div>
  <div class="wrap">
    <h1 id="title"></h1>
    <nav class="tabs" id="tabs" aria-label="하위 메뉴"></nav>
    <p class="lead" id="lead" hidden></p>
    <div class="content" id="content"></div>
  </div>
</main>

<script>
const FIELDS = ['인사조직','재무관리','마케팅','운영관리·경영과학','전략·국제경영','회계','경영정보'];

const MENU = [
  { name:'학과소개', tabs:[],
    view:{kind:'split', note:'학과소개·교육목표·인사말·찾아오시는길을 한 페이지로 통합 → <a href="https://woonki-konkuk.github.io/biz-intro/" target="_blank" rel="noopener">통합 페이지 시안 보기</a>'} },
  { name:'교육과정', tabs:[
      { name:'교육과정', lead:'학년·학기별 교과목 편성표', view:{kind:'table', cols:['학년','학기','교과목명','이수구분','학점'], rows:6} },
      { name:'졸업요건', lead:'졸업을 위해 충족해야 하는 기준', view:{kind:'dl', rows:['총 이수학점','전공 이수학점','교양 이수학점','졸업 인증 (어학·논문 등)','기타']} },
      { name:'이수학점 및 필수과목', view:{kind:'table', cols:['이수구분','교과목명','학점','비고'], rows:5} },
      { name:'경영학과 장학', lead:'학과 자체 장학 안내', view:{kind:'table', cols:['장학금명','지급 대상','금액','신청 시기'], rows:4} },
      { name:'학교 장학', ext:'건국대학교 장학 안내' },
      { name:'학사일정', ext:'Outlook 학사일정' } ] },
  { name:'교수소개', tabs:['전체', ...FIELDS, '산학·겸임·초빙', '명예교수'].map(n => ({ name:n, view:{kind:'blank'} })) },   // 하위 내용 스케치 없음
  { name:'커뮤니티', tabs:[
      { name:'공지사항', view:{kind:'board', rows:6} },
      { name:'FAQ', view:{kind:'faq', rows:5} },
      { name:'자료실', view:{kind:'board', rows:6, file:true} },
      { name:'포토갤러리', view:{kind:'gallery', n:6} } ] },
  { name:'학생활동', tabs:[
      { name:'학생회 소개', view:{kind:'split'} },
      { name:'학술동아리', view:{kind:'gallery', n:3} } ] },
  { name:'취업지원', tabs:[], view:{kind:'board', rows:6} },
  { name:'이용안내', tabs:[
      { name:'사이트맵', view:{kind:'sitemap'} },
      { name:'로그인', view:{kind:'login'} } ] }
];

const state = { m:1, t:0 };   // 처음 열면 교육과정 › 첫 탭

/* ── 스케치 렌더러 ── */
const sk = w => `<span class="sk w${w}"></span>`;
const cyc = (arr, i) => arr[i % arr.length];

const VIEW = {
  blank: () => `<div class="ph">본문 영역 — 내용은 생략</div>`,

  table: v => `<table class="tbl"><thead><tr>${v.cols.map((c,i) => `<th${i===0?' class="c"':''}>${c}</th>`).join('')}</tr></thead><tbody>${
    Array.from({length:v.rows}, (_,r) => `<tr>${v.cols.map((c,i) => i===0
      ? `<td class="c">${sk(6)}</td>`
      : `<td>${sk(cyc([3,4,2,1,3],(r+i)))}</td>`).join('')}</tr>`).join('')}</tbody></table>`,

  dl: v => `<dl class="dl">${v.rows.map((r,i) => `<div><dt>${r}</dt><dd>${sk(cyc([2,3,2,4,1],i))}</dd></div>`).join('')}</dl>`,

  cards: v => `<div class="cards">${Array.from({length:v.n}, (_,i) => `<div class="card"><div class="img">사진</div><span class="nm"></span><p class="fd">${cyc(v.fields,i)}</p><div class="ct">${sk(4)}${sk(3)}</div></div>`).join('')}</div>`,

  board: v => `<table class="tbl"><thead><tr><th class="c">번호</th><th>제목</th><th>작성자</th><th>작성일</th><th class="c">조회</th>${v.file?'<th class="c">첨부</th>':''}</tr></thead><tbody>${
    Array.from({length:v.rows}, (_,i) => `<tr><td class="c num">${v.rows-i}</td><td>${sk(cyc([4,5,3,4,2,5],i))}</td><td>${sk(6)}</td><td>${sk(6)}</td><td class="c">${sk(6)}</td>${v.file?'<td class="c">📎</td>':''}</tr>`).join('')}</tbody></table>`,

  faq: v => `<div class="faq">${Array.from({length:v.rows}, (_,i) => `<div><span class="q">Q</span>${sk(cyc([4,3,5,3,4],i))}<span class="pl">+</span></div>`).join('')}</div>`,

  gallery: v => `<div class="gallery">${Array.from({length:v.n}, () => `<div><div class="img">이미지</div><div class="cap">${sk(4)}${sk(2)}</div></div>`).join('')}</div>`,

  split: v => `<div class="split"><div class="para">${[5,6,4,6,5,3].map(sk).join('')}</div><div class="img">이미지</div></div>${v.note ? `<p class="note">${v.note}</p>` : ''}`,

  ext: v => `<div class="extcard"><div><b>${v.name}</b><span>외부 페이지(${v.ext})로 연결됩니다. 새 창으로 열림.</span></div><a class="btn" href="#">${v.name} 바로가기 ↗</a></div>`,

  sitemap: () => `<div class="sitemap">${MENU.map(m => `<div><h3>${m.name}</h3><ul>${m.tabs.length ? m.tabs.map(t => `<li>${t.name}${t.ext?' ↗':''}</li>`).join('') : '<li class="muted">단일 페이지</li>'}</ul></div>`).join('')}</div>`,

  login: () => `<form class="login" onsubmit="return false"><input type="text" placeholder="아이디" disabled><input type="password" placeholder="비밀번호" disabled><span class="btn">로그인</span></form>`
};

function btn(label, cls, on, current){
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = label;
  if (cls) b.className = cls;
  if (current) b.setAttribute('aria-current','true');
  b.addEventListener('click', on);
  return b;
}

function render(){
  const menu = MENU[state.m];
  const tab  = menu.tabs[state.t];

  const gnb = document.getElementById('gnb'); gnb.replaceChildren();
  MENU.forEach((m,i) => gnb.append(btn(m.name, '', () => { state.m=i; state.t=0; render(); }, i===state.m)));

  const tabs = document.getElementById('tabs');
  tabs.hidden = menu.tabs.length === 0; tabs.replaceChildren();
  menu.tabs.forEach((t,i) => tabs.append(btn(t.name, t.ext ? 'ext' : '', () => { state.t=i; render(); }, i===state.t)));

  document.getElementById('title').textContent = menu.name;

  const lead = document.getElementById('lead');
  lead.hidden = !(tab && tab.lead); lead.textContent = (tab && tab.lead) || '';

  const view = tab ? (tab.ext ? {kind:'ext', name:tab.name, ext:tab.ext} : tab.view) : menu.view;
  document.getElementById('content').innerHTML = VIEW[view.kind](view);
}

render();

/* 엠블럼: 스크롤보다 느리게 흐르고, 마우스 위치에 따라 살짝 기울어짐 */
(() => {
  const em = document.getElementById('emblem');
  if (!em || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let ty = 0, rot = 0, cy = 0, crot = 0;
  addEventListener('scroll', () => { ty = scrollY * 0.35; }, {passive:true});
  addEventListener('pointermove', e => {
    rot = (e.clientX / innerWidth - 0.5) * 2.4 + (e.clientY / innerHeight - 0.5) * 0.8;
  }, {passive:true});
  (function tick(){
    cy += (ty - cy) * 0.08; crot += (rot - crot) * 0.06;
    em.style.transform = `translateY(${cy.toFixed(1)}px) rotate(${crot.toFixed(2)}deg)`;
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
