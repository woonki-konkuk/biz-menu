<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경영학과 메뉴 구성 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
@font-face{font-family:'S-Core Dream';font-weight:500;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-5Medium.woff') format('woff')}
@font-face{font-family:'S-Core Dream';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-6Bold.woff') format('woff')}

:root{
  color-scheme:light;
  --ku-green:#005128; --green-bright:#18944A;
  --ink:#1A211D; --ink-2:#4F5B55; --ink-3:#7B8680;
  --line:#D8E0DA; --line-strong:#B9C6BE; --bar:#E3E9E5;
  --ground:#F4F7F5; --surface:#FFFFFF;
  --display:'S-Core Dream','Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --wrap:1140px; --gutter:24px;
  --hero-h:clamp(170px,19vw,240px); --mv-h:clamp(300px,40vw,500px);
}
*,*::before,*::after{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{appearance:none;background:none;border:0;font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--green-bright);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.25;font-weight:700}
p,dl,dt,dd{margin:0}
ul{margin:0;padding:0;list-style:none}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gutter)}

/* ── 헤더: 로고 + 상단 메뉴 (드롭다운 없음) ── */
.hdr{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:stretch;justify-content:space-between;gap:32px}
.logo{display:flex;align-items:center;gap:12px;padding:16px 0}
.logo .ku{display:inline-grid;place-items:center;width:44px;height:44px;border:2px solid var(--ku-green);color:var(--ku-green);font-family:var(--display);font-weight:700;font-size:15px;border-radius:3px}
.logo .name{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.logo .name small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:2px}
.gnb{display:flex;align-items:center;gap:2px}
.gnb button{position:relative;font-family:var(--display);font-weight:500;font-size:17px;padding:6px 14px 9px;color:var(--ink)}
.gnb button::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;background:var(--ku-green);opacity:0;transition:opacity .15s}
.gnb button:hover{color:var(--ku-green)}
.gnb button[aria-current="true"]{color:var(--ku-green);font-weight:700}
.gnb button[aria-current="true"]::after{opacity:1}

/* ── 하위 메뉴 = 페이지 안의 탭 (제목 아래) ── */
.tabs{display:flex;gap:2px;margin-top:30px;border-bottom:1px solid var(--line-strong);overflow-x:auto;scrollbar-width:none}
.tabs[hidden]{display:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:12px 18px 10px;font-family:var(--display);font-weight:500;font-size:15px;color:var(--ink-2);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ku-green)}
.tabs button[aria-current="true"]{color:var(--ku-green);font-weight:700;border-bottom-color:var(--ku-green)}
.tabs .ext::after{content:" ↗";font-size:12px;color:var(--ink-3)}

/* ── 사진 히어로: 현재 사이트 서브비주얼 방식 (사진 + 흰 제목 + 문구), 아이콘·브레드크럼 줄은 제거 ── */
.hero{display:block;position:relative;height:var(--hero-h);overflow:hidden;background:var(--green-deep)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,22,11,.66) 0%,rgba(0,22,11,.42) 45%,rgba(0,22,11,.28) 100%)}
.hero .wrap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:1;display:flex;align-items:center;gap:30px;color:#fff}
.hero h1{font-size:34px;letter-spacing:-.01em;color:#fff}
.hero .tag{font-size:13px;line-height:1.55;opacity:.9;padding-top:6px}
.hero .tag b{display:block;font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.01em}
.hero .desc{display:none}
.hero .dt{display:none}

/* 히어로 2번: 타이포 밴드 — 사진 없이 연녹색 밴드 + 제목 (1번은 기본 = 현재 방식) */
body[data-hero="2"]{--hero-h:150px}
body[data-hero="2"] .hero{background:#E6EFE9}
body[data-hero="2"] .hero img,body[data-hero="2"] .hero::after,body[data-hero="2"] .hero .tag{display:none}
body[data-hero="2"] .hero .wrap{color:var(--ku-green);justify-content:space-between;align-items:baseline}
body[data-hero="2"] .hero h1{color:var(--ku-green)}
body[data-hero="2"] .hero .desc{display:block;font-size:14px;color:var(--ink-2)}


/* 히어로 3번: 듀오톤 — 사진에 KU 그린 듀오톤, 흰 제목 */
body[data-hero="3"]{--hero-h:clamp(190px,19vw,240px)}
body[data-hero="3"] .hero{background:var(--ku-green)}
body[data-hero="3"] .hero img{filter:grayscale(1) contrast(1.12) brightness(.98)}
body[data-hero="3"] .hero .dt{display:block;position:absolute;inset:0}
body[data-hero="3"] .hero .dt1{background:var(--ku-green);mix-blend-mode:multiply}
body[data-hero="3"] .hero .dt2{background:rgba(155,216,178,.3);mix-blend-mode:screen}
body[data-hero="3"] .hero::after{background:linear-gradient(90deg,rgba(0,30,15,.5) 0%,rgba(0,30,15,0) 60%)}
body[data-hero="3"] .hero .tag{display:none}
body[data-hero="3"] .hero .wrap{display:block}
body[data-hero="3"] .hero .desc{display:block;font-size:15px;color:rgba(255,255,255,.88);margin-top:6px}

/* 히어로 옵션 스위치 — 오른쪽 아래 (검토용, 공유 링크 #h1 #h2 #h3) */
.hsw{position:fixed;right:14px;bottom:14px;z-index:9;display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.hsw span{padding:0 6px 0 13px;color:var(--ink-3)}
.hsw button{padding:7px 12px;color:var(--ink-2)}
.hsw button[aria-current="true"]{background:var(--ku-green);color:#fff}

/* ── 홈: 메인 비주얼 (현재 홈의 슬라이드 자리, 사진은 임시로 hero.jpg) ── */
.mv{display:none;position:relative;height:var(--mv-h);overflow:hidden;background:var(--green-deep)}
.mv img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.mv::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,35,18,.62) 0%,rgba(0,35,18,.25) 55%,rgba(0,35,18,.1) 100%)}
.mv .wrap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:1;color:#fff}
.mv .en{font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.06em;opacity:.9}
.mv h1{font-size:clamp(28px,4vw,44px);color:#fff;margin:6px 0 10px;letter-spacing:-.01em}
.mv p{font-size:16px;opacity:.92}
.mv .dots{position:absolute;left:0;right:0;bottom:22px;z-index:1;color:#fff;font-size:12px;font-family:var(--display);letter-spacing:.08em}
.mv .dots .wrap{position:static;transform:none;display:flex;gap:10px;align-items:center}
.mv .dots i{display:inline-block;width:26px;height:1px;background:rgba(255,255,255,.5)}
.mv .dots b{font-weight:700}
body.is-home .hero,body.is-home .sub-bar{display:none}
body.is-home .mv{display:block}
body.is-home .content{margin-top:40px;min-height:0}
body.is-home .emblem-wm{top:calc(var(--mv-h) - 120px)}
/* 홈 섹션 */
.home{display:grid;gap:56px}
.h-top{display:grid;grid-template-columns:minmax(250px,300px) 1fr;gap:28px;align-items:stretch}
.sched{background:var(--ku-green);color:#fff;padding:24px 26px 22px}
.sched h2{font-size:17px;color:#fff}
.sched .ym{font-family:var(--display);font-weight:700;font-size:22px;margin:4px 0 12px}
.sched li{padding:10px 0;border-top:1px solid rgba(255,255,255,.22);font-size:12px;opacity:.95}
.sched li b{display:block;font-size:14px;font-weight:600;margin-top:2px}
.sched .more{margin-top:12px;font-size:12px;opacity:.8}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.quick button{background:var(--surface);padding:24px 16px 20px;display:grid;gap:6px;justify-items:center;text-align:center}
.quick button:hover b{color:var(--ku-green)}
.quick .ico{width:42px;height:42px;border:1px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;color:var(--ku-green);font-size:10px;font-family:var(--display);font-weight:700}
.quick b{font-family:var(--display);font-weight:700;font-size:15px}
.quick small{font-size:12px;color:var(--ink-3)}
.h-mid{display:grid;grid-template-columns:1fr minmax(250px,300px);gap:28px}
.notice-head{display:flex;align-items:baseline;gap:16px;border-bottom:2px solid var(--ku-green);padding-bottom:10px}
.notice-head h2{font-size:20px}
.notice-head .t{font-size:14px;color:var(--ink-3)}
.notice-head .t.on{color:var(--ku-green);font-weight:700}
.notice-head .more{margin-left:auto;font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
.notice li{display:grid;grid-template-columns:1fr 60px;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}
.notice li b{display:block;font-weight:600;font-size:15px;line-height:1.4;margin-bottom:3px}
.notice li p{font-size:13px;color:var(--ink-3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.notice .date{text-align:right;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.notice .date b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);margin:0}
.popup h2{font-size:12px;color:var(--ink-3);letter-spacing:.1em;margin-bottom:10px}
.popup .img{aspect-ratio:3/2}
.popup p{font-size:13px;color:var(--ink-2);margin-top:8px}
.h-bot{display:grid;grid-template-columns:repeat(3,1fr) 1.4fr;gap:18px}
.bnr{border:1px solid var(--line);padding:22px 20px;display:grid;gap:4px;align-content:start;min-height:150px;text-align:left}
.bnr b{font-family:var(--display);font-weight:700;font-size:17px}
.bnr small{font-size:13px;color:var(--ink-2)}
.bnr .vm{margin-top:auto;padding-top:14px;font-size:11px;letter-spacing:.08em;color:var(--green-bright);font-weight:700}
.gal .img{height:100%;min-height:150px}

/* ── 히어로 + 본문 무대 (엠블럼이 사진 위에서 본문까지 걸침) ── */
.stage{position:relative;overflow:hidden}
.page{padding:0 0 80px}

/* ── 건국대 엠블럼 워터마크 (오른쪽 상단) — 링은 고정, 안쪽 황소만 걷는 박자로 움직임 ── */
.emblem-wm{position:absolute;top:calc(var(--hero-h) - 120px);right:-64px;z-index:3;width:min(380px,38vw);opacity:.13;pointer-events:none;user-select:none;-webkit-user-select:none;will-change:transform;transform-origin:50% 45%}
.emblem-wm img{width:100%;display:block}
.emblem-ring{
  -webkit-mask-image:radial-gradient(circle closest-side at 50% 50%,transparent 69%,#000 70%),radial-gradient(ellipse 9.5% 5.5% at 53% 87.7%,transparent 96%,#000 100%);
  -webkit-mask-composite:source-in;
  mask-image:radial-gradient(circle closest-side at 50% 50%,transparent 69%,#000 70%),radial-gradient(ellipse 9.5% 5.5% at 53% 87.7%,transparent 96%,#000 100%);
  mask-composite:intersect}
.emblem-bull{position:absolute;inset:0;
  -webkit-mask-image:radial-gradient(circle closest-side at 50% 50%,#000 69%,transparent 70%),radial-gradient(ellipse 9.5% 5.5% at 53% 87.7%,#000 96%,transparent 100%);
  mask-image:radial-gradient(circle closest-side at 50% 50%,#000 69%,transparent 70%),radial-gradient(ellipse 9.5% 5.5% at 53% 87.7%,#000 96%,transparent 100%);
  transform-origin:50% 80%;animation:bullWalk 2.6s ease-in-out infinite}
@keyframes bullWalk{
  0%{transform:translateY(0) rotate(0deg)}
  25%{transform:translateY(-3px) rotate(.8deg)}
  50%{transform:translateY(.6px) rotate(0deg)}
  75%{transform:translateY(-3px) rotate(-.8deg)}
  100%{transform:translateY(0) rotate(0deg)}}
@media (prefers-reduced-motion:reduce){.emblem-bull{animation:none}}
/* 탭 아래 툴바 줄 — 내용이 있든 없든 같은 높이라 본문 시작 위치가 탭마다 같음 */
.sub-bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:38px;margin-top:20px}
.lead{font-size:15px;color:var(--ink-2)}
.content{margin-top:12px;min-height:520px}
.note{margin-top:14px;font-size:13px;color:var(--ink-3)}
.note a{color:var(--green-bright);text-decoration:underline;text-underline-offset:3px}

/* ── 학과소개: 통합 페이지 시안 본문 그대로 (학과소개_통합_시안_v1.html에서 이식, .intro 스코프) ── */
.intro{font-size:17px;line-height:1.8;overflow-wrap:anywhere}
.intro h2,.intro h3{text-wrap:balance}
.intro .imgph{display:grid;place-items:center;text-align:center;padding:16px;border:1.5px dashed var(--line-strong);color:var(--ink-3);font-size:12.5px;line-height:1.5;background:repeating-linear-gradient(45deg,#F3F6F4 0 10px,#EBF0ED 10px 20px)}
.intro .imgph b{display:block;font-weight:700;color:var(--ink-2);font-size:14px;margin-bottom:2px}
.intro .sec{padding-block:52px}
.intro .sec:first-child{padding-top:6px}
.intro .sec:last-child{padding-bottom:0}
.intro .sec.band{background:#E6EFE9;padding:40px 44px}
.intro .sec.tint{background:var(--ground);padding:44px;margin-top:52px}
.intro .sec-head{margin-bottom:22px}
.intro .eyebrow{font-family:var(--display);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--green-bright)}
.intro .sec-head h2{font-size:clamp(24px,2.6vw,30px);letter-spacing:-.02em;margin-top:6px}
/* 학과소개 */
.intro .about{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:56px;align-items:start}
.intro .about .text p{max-width:40em;font-size:18px;line-height:1.9}
.intro .about .text strong{color:var(--ku-green);font-weight:600}
.intro .fields h3{font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.intro .fields h3 span{font-family:var(--display);font-weight:700;color:var(--ku-green);font-size:16px}
.intro .fields ul{display:flex;flex-wrap:wrap;gap:6px 20px}
.intro .fields li{display:inline-flex;align-items:baseline;gap:5px;font-size:16px;font-weight:500;line-height:1.6}
.intro .fields li::before{content:"#";font-family:var(--display);font-weight:700;color:var(--green-bright)}
/* 교육목표 */
.intro .goals{border-top:1px solid var(--ink)}
.intro .goals li{display:grid;grid-template-columns:minmax(170px,240px) 1fr;gap:4px 32px;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--line-strong)}
.intro .goals .en{font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-bright)}
.intro .goals h3{font-size:20px;color:var(--ku-green);margin:2px 0 0;letter-spacing:-.01em}
.intro .goals p{font-size:15px;line-height:1.7;color:var(--ink-2)}
/* 인사말 */
.intro .greet{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:44px;align-items:start}
.intro .chairs{display:grid;gap:14px}
.intro .chair{display:grid;grid-template-columns:108px 1fr;background:var(--surface);border:1px solid var(--line)}
.intro .chair .imgph{border-width:0 1.5px 0 0;padding:8px;font-size:11px}
.intro .chair .imgph b{font-size:12px}
.intro .chair .body{padding:12px 14px 14px}
.intro .chair .role{font-size:11.5px;color:var(--green-bright);font-weight:700;letter-spacing:.1em}
.intro .chair h3{font-size:18px;margin:2px 0 10px}
.intro .chair h3 small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--ink-2);margin-left:4px}
.intro .chair dl{display:grid;gap:5px;font-size:13px;line-height:1.45}
.intro .chair dt{color:var(--ink-3);font-size:11px;letter-spacing:.06em}
.intro .chair dd{overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.intro .chair .consult{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ku-green);font-weight:600;line-height:1.5;display:grid;grid-template-columns:auto 1fr;gap:6px}
.intro .chair .consult::before{content:"상담";font-size:10.5px;letter-spacing:.08em;color:var(--ink-3);font-weight:700;padding-top:3px}
.intro .greet .text{max-width:40em}
.intro .greet .text p{margin-bottom:1.2em}
.intro .greet .text p.open{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.6;color:var(--ku-green);margin-bottom:1.1em}
.intro .sign{margin-top:32px;padding-top:20px;border-top:1px solid var(--line-strong);font-size:14px;color:var(--ink-2)}
.intro .sign b{display:block;font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink);margin-top:2px}
/* 찾아오시는길 */
.intro .loc{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:52px;align-items:start}
.intro .addr{border-top:1px solid var(--ink);padding-top:20px;margin-bottom:28px}
.intro .addr dl{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;font-size:16px}
.intro .addr dt{color:var(--ink-3);font-size:13px;padding-top:5px;white-space:nowrap}
.intro .addr dd{font-weight:500;line-height:1.6;font-variant-numeric:tabular-nums}
.intro .map{aspect-ratio:4/3}
.intro .way{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:20px 0;border-top:1px solid var(--line)}
.intro .way:last-child{border-bottom:1px solid var(--line)}
.intro .way .ico{width:44px;height:44px;border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--ku-green);background:var(--surface)}
.intro .way h3{font-size:16px;margin-bottom:8px}
.intro .way li{font-size:15px;display:grid;grid-template-columns:minmax(0,auto) 1fr;gap:12px;padding:3px 0;line-height:1.6}
.intro .way li b{font-weight:600;color:var(--ink-2)}
.intro .way li span{font-variant-numeric:tabular-nums}
@media (max-width:960px){.intro .about,.intro .loc{grid-template-columns:1fr;gap:36px}}
@media (max-width:640px){.intro .greet{grid-template-columns:1fr;gap:28px}.intro .goals li{grid-template-columns:1fr;gap:2px}.intro .sec.band,.intro .sec.tint{padding:28px 20px}}

/* ── 하위 내용 스케치 (구조만, 값은 회색 바) ── */
.sk{display:inline-block;height:10px;border-radius:5px;background:var(--bar);vertical-align:middle}
.sk.w1{width:18%}.sk.w2{width:32%}.sk.w3{width:48%}.sk.w4{width:64%}.sk.w5{width:82%}.sk.w6{width:100%}
.img{background:repeating-linear-gradient(135deg,transparent 0 12px,rgba(0,81,40,.045) 12px 24px),var(--ground);border:1px dashed var(--line-strong);border-radius:4px;display:grid;place-items:center;color:var(--ink-3);font-size:12px}

  bnr: [['입학안내','경영대학 입학안내'],['교수진 소개','경영학과 교수 소개','교수소개'],['취업&공모','경영대학 제공 취업&공모 소식','취업지원']]

const VIEW = {
  blank: () => `<div class="ph">본문 영역 — 내용은 생략</div>`,

  home: () => `<div class="home">
    <div class="h-top">
      <div class="sched"><h2>Schedule</h2><p class="ym">${HOME.sched.ym}</p><ul>${HOME.sched.items.map(([d,t]) => `<li>${d}<b>${t}</b></li>`).join('')}</ul><p class="more">더보기 +</p></div>
      <div class="quick">${HOME.quick.map(([t,d,go]) => `<button type="button" data-go="${go}"><span class="ico">${t.slice(0,2)}</span><b>${t}</b><small>${d}</small></button>`).join('')}</div>
    </div>
    <div class="h-mid">
      <div class="notice"><div class="notice-head"><h2>Notice</h2><span class="t on">공지사항</span><span class="t">자료실</span><span class="more">더보기 READ MORE</span></div>
        <ul>${HOME.notice.map(([t,d,m,day]) => `<li><div><b>${t}</b><p>${d}</p></div><div class="date">2026.${m}<b>${day}</b></div></li>`).join('')}</ul></div>
      <div class="popup"><h2>POPUP ZONE</h2><div class="img">이미지 · '경영학과' NEW Open</div><p>경영학과 홈페이지가 새롭게 오픈하였습니다.</p></div>
    </div>
    <div class="h-bot">
      ${HOME.bnr.map(([t,d,go]) => `<button type="button" class="bnr" data-go="${go||''}"><b>${t}</b><small>${d}</small><span class="vm">VIEW MORE</span></button>`).join('')}
      <div class="gal"><div class="img">포토갤러리 이미지</div></div>
    </div>
  </div>`,

  intro: () => `<div class="intro">${document.getElementById('intro-tpl').innerHTML}</div>`,

  curriculum: () => `<table class="tbl curr"><caption class="sr" hidden>${CURR_SUBS[state.sub]}</caption><thead><tr><th class="c">학년-학기</th><th class="c">이수구분</th><th class="c">학수번호</th><th>교과목명</th><th>영문교과목명</th><th class="c">학점(시간)</th></tr></thead><tbody>${
      state.sub === 0
        ? CURR_ROWS.map(r => `<tr><td class="c">${r[0]}</td><td class="c">${r[1]}</td><td class="c num">${r[2]}</td><td>${r[3]}</td><td class="en">${r[4]}</td><td class="c">${r[5]}</td></tr>`).join('') + `<tr class="more"><td colspan="6">… 이하 생략 (실제로는 전체 교과목 표시)</td></tr>`
        : `<tr class="more"><td colspan="6">해당되는 데이터가 없습니다.</td></tr>`
    }</tbody></table>`,

  table: v => `<table class="tbl"><thead><tr>${v.cols.map((c,i) => `<th${i===0?' class="c"':''}>${c}</th>`).join('')}</tr></thead><tbody>${
    Array.from({length:v.rows}, (_,r) => `<tr>${v.cols.map((c,i) => i===0
      ? `<td class="c">${sk(6)}</td>`
      : `<td>${sk(cyc([3,4,2,1,3],(r+i)))}</td>`).join('')}</tr>`).join('')}</tbody></table>`,

  dl: v => `<dl class="dl">${v.rows.map((r,i) => `<div><dt>${r}</dt><dd>${sk(cyc([2,3,2,4,1],i))}</dd></div>`).join('')}</dl>`,

  cards: v => `<div class="cards">${Array.from({length:v.n}, (_,i) => `<div class="card"><div class="img">사진</div><span class="nm"></span><p class="fd">${cyc(v.fields,i)}</p><div class="ct">${sk(4)}${sk(3)}</div></div>`).join('')}</div>`,

  board: v => `<table class="tbl"><thead><tr><th class="c">번호</th><th>제목</th><th>작성자</th><th>작성일</th><th class="c">조회</th>${v.file?'<th class="c">첨부</th>':''}</tr></thead><tbody>${
    Array.from({length:v.rows}, (_,i) => `<tr><td class="c num">${v.rows-i}</td><td>${sk(cyc([4,5,3,4,2,5],i))}</td><td>${sk(6)}</td><td>${sk(6)}</td><td class="c">${sk(6)}</td>${v.file?'<td class="c">📎</td>':''}</tr>`).join('')}</tbody></table>`,

  faq: v => `<div class="faq">${Array.from({length:v.rows}, (_,i) => `<div><span class="q">Q</span>${sk(cyc([4,3,5,3,4],i))}<span class="pl">+</span></div>`).join('')}</div>`,

  gallery: v => `<div class="gallery">${Array.from({length:v.n}, () => `<div><div class="img">이미지</div><div class="cap">${sk(4)}${sk(2)}</div></div>`).join('')}</div>`,

  split: v => `<div class="split"><div class="para">${[5,6,4,6,5,3].map(sk).join('')}</div><div class="img">이미지</div></div>${v.note ? `<p class="note">${v.note}</p>` : ''}`,

  ext: v => `<div class="extcard"><div><b>${v.name}</b><span>외부 페이지(${v.ext})로 연결됩니다. 새 창으로 열림.</span></div><a class="btn" href="#">${v.name} 바로가기 ↗</a></div>`,

  sitemap: () => `<div class="sitemap">${MENU.map(m => `<div><h3>${m.name}</h3><ul>${m.tabs.length ? m.tabs.map(t => `<li>${t.name}${t.ext?' ↗':''}</li>`).join('') : '<li class="muted">단일 페이지</li>'}</ul></div>`).join('')}</div>`,

  login: () => `<form class="login" onsubmit="return false"><input type="text" placeholder="아이디" disabled><input type="password" placeholder="비밀번호" disabled><span class="btn">로그인</span></form>`
};

function btn(label, cls, on, current){
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = label;
  if (cls) b.className = cls;
  if (current) b.setAttribute('aria-current','true');
  b.addEventListener('click', on);
  return b;
}

function render(){
  const menu = MENU[state.m];
  const tab  = menu.tabs[state.t];

  const gnb = document.getElementById('gnb'); gnb.replaceChildren();
  MENU.forEach((m,i) => { if (m.home) return;   // 홈은 상단 메뉴에 없음 — 로고(경영학과) 클릭으로만
    gnb.append(btn(m.name, '', () => { state.m=i; state.t=0; state.sub=0; render(); }, i===state.m)); });

  const tabs = document.getElementById('tabs');
  tabs.hidden = menu.tabs.length === 0; tabs.replaceChildren();
  menu.tabs.forEach((t,i) => tabs.append(btn(t.name, t.ext ? 'ext' : '', () => { state.t=i; state.sub=0; render(); }, i===state.t)));

  document.getElementById('heroTitle').textContent = menu.name;
  document.getElementById('heroDesc').textContent = menu.desc || '';
  document.body.classList.toggle('is-home', !!menu.home);

  const view = tab ? (tab.ext ? {kind:'ext', name:tab.name, ext:tab.ext} : tab.view) : menu.view;
  document.getElementById('subbar').innerHTML = view.kind === 'curriculum' ? CURR_BAR() : (tab && tab.lead ? `<p class="lead">${tab.lead}</p>` : '');
  document.getElementById('content').innerHTML = VIEW[view.kind](view);
  document.querySelectorAll('#seg button').forEach((b,i) => b.addEventListener('click', () => { state.sub=i; render(); }));
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    const [mn, tn] = b.dataset.go.split('|'); if (!mn) return;
    const mi = MENU.findIndex(m => m.name === mn); if (mi < 0) return;
    state.m = mi; state.t = Math.max(0, MENU[mi].tabs.findIndex(t => t.name === tn)); state.sub = 0; render(); scrollTo(0, 0);
  }));
}
/* 히어로 옵션 스위치 — 1번 현재 방식 / 2번 타이포 밴드 / 3번 듀오톤, 공유 링크 #h1 #h2 #h3 */
function setHero(h){
  document.body.dataset.hero = h;
  history.replaceState(null, '', '#h' + h);
  document.querySelectorAll('.hsw button').forEach(b => b.setAttribute('aria-current', String(b.dataset.h === h)));
}
document.querySelectorAll('.hsw button').forEach(b => b.addEventListener('click', () => setHero(b.dataset.h)));
setHero((location.hash.match(/^#h([123])$/) || [,'1'])[1]);

document.getElementById('logo').addEventListener('click', e => { e.preventDefault(); state.m = 0; state.t = 0; state.sub = 0; render(); scrollTo(0, 0); });

render();

/* 엠블럼: 스크롤보다 느리게 흐르고, 마우스 위치에 따라 살짝 기울어짐 */
(() => {
  const em = document.getElementById('emblem');
  if (!em || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let ty = 0, rot = 0, cy = 0, crot = 0;
  addEventListener('scroll', () => { ty = scrollY * 0.35; }, {passive:true});
  addEventListener('pointermove', e => {
    rot = (e.clientX / innerWidth - 0.5) * 2.4 + (e.clientY / innerHeight - 0.5) * 0.8;
  }, {passive:true});
  (function tick(){
    cy += (ty - cy) * 0.08; crot += (rot - crot) * 0.06;
    em.style.transform = `translateY(${cy.toFixed(1)}px) rotate(${crot.toFixed(2)}deg)`;
    requestAnimationFrame(tick);
  })();
})();
</script>
